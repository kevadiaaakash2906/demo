<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcel tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --kraft: #dcc7a1;
    --label: #fdfaf3;
    --ink: #2b1d14;
    --muted: #7a6650;
    --brown: #4a2c1a;
    --line: #cdb88f;
    --c-created: #8a7a66;
    --c-transit: #2f6f9f;
    --c-out: #c77700;
    --c-delivered: #2e7d4f;
    --c-exception: #b3261e;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 1rem; }
  body {
    margin: 0; background: var(--kraft); color: var(--ink);
    font: 16px/1.5 'Barlow', system-ui, sans-serif;
    min-height: 100vh;
  }
  main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1, .num, .status { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  h1 { margin: 0; font-size: 2.4rem; line-height: 1; color: var(--brown); letter-spacing: .01em; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 4px;
    padding: .55rem .9rem; background: var(--brown); color: #fff;
  }
  button.ghost { background: transparent; color: var(--brown); border: 1px solid var(--brown); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid #1b5fa8; outline-offset: 2px; }

  .add { display: grid; grid-template-columns: 1fr 9rem auto; gap: .5rem; margin-bottom: .5rem; }
  input {
    font: inherit; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 4px;
    background: var(--label); color: var(--ink); min-width: 0;
  }
  .hint { color: var(--muted); font-size: .9rem; margin: 0 0 1.25rem; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; color: var(--muted); font-size: .9rem; }
  .msg { background: #f6dcd8; color: #5c1510; border-radius: 4px; padding: .6rem .8rem; margin-bottom: 1rem; }
  .msg[hidden] { display: none; }

  .parcel {
    --c: var(--c-created);
    background: var(--label); border-radius: 4px; margin-bottom: .75rem;
    border-left: 8px solid var(--c); padding: .9rem 1rem;
    box-shadow: 0 1px 0 var(--line);
  }
  .parcel[data-state="transit"] { --c: var(--c-transit); }
  .parcel[data-state="out"] { --c: var(--c-out); }
  .parcel[data-state="delivered"] { --c: var(--c-delivered); }
  .parcel[data-state="exception"] { --c: var(--c-exception); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  .num { font-size: 1.15rem; font-weight: 600; letter-spacing: .02em; }
  .nick { color: var(--muted); margin-left: .5rem; font-family: 'Barlow', sans-serif; font-size: .95rem; font-weight: 400; letter-spacing: 0; }
  .status { font-size: 1.5rem; font-weight: 700; color: var(--c); line-height: 1.1; margin: .35rem 0 .1rem; }
  .meta { color: var(--muted); font-size: .95rem; }
  .err { color: var(--c-exception); }
  details { margin-top: .6rem; }
  summary { cursor: pointer; color: var(--brown); font-weight: 500; }
  ol { list-style: none; margin: .6rem 0 0; padding: 0 0 0 .9rem; border-left: 2px solid var(--line); }
  li { margin: 0 0 .6rem; position: relative; }
  li::before { content: ''; position: absolute; left: -1.2rem; top: .5rem; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  li:first-child::before { background: var(--c); }
  .actions { margin-top: .5rem; display: flex; gap: .5rem; }
  .actions button { padding: .25rem .6rem; font-size: .9rem; }
  .empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; border: 2px dashed var(--line); border-radius: 4px; }
  #gate { text-align: center; padding: 3rem 1rem; }
  #gate p { color: var(--muted); max-width: 32ch; margin: 0 auto 1.25rem; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { .add { grid-template-columns: 1fr auto; } .add #label { grid-column: 1 / -1; grid-row: 2; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Parcel tracker</h1>
    <button id="signout" class="ghost" hidden>Sign out</button>
  </header>

  <section id="gate" hidden>
    <p>Sign in to keep your tracking list in sync across your devices.</p>
    <button id="signin">Sign in with Google</button>
  </section>

  <section id="app" hidden>
    <div class="add">
      <input id="numbers" placeholder="Tracking numbers, e.g. 1Z999AA10123456784" autocomplete="off" aria-label="Tracking numbers">
      <input id="label" placeholder="Nickname (optional)" aria-label="Nickname">
      <button id="add">Add</button>
    </div>
    <p class="hint">Paste one or several numbers separated by spaces or commas.</p>
    <div id="error" class="msg" role="alert" hidden></div>
    <div class="bar">
      <span id="updated">Not refreshed yet</span>
      <button id="refresh" class="ghost">Refresh all</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ---- 1. Paste your Firebase web app config here (Project settings > Your apps) ----
const firebaseConfig = {
  apiKey: 'YOUR_API_KEY',
  authDomain: 'YOUR_PROJECT.firebaseapp.com',
  projectId: 'YOUR_PROJECT',
  appId: 'YOUR_APP_ID',
};
// -----------------------------------------------------------------------------------

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const $ = (id) => document.getElementById(id);
const NUMBER_RE = /^[0-9A-Z]{8,26}$/;
const AUTO_REFRESH_MS = 10 * 60 * 1000;

let parcels = [];      // from Firestore: { id, label, cached }
let live = {};         // fresh results this session, keyed by tracking number
let unsub = null;
let busy = false;
let timer = null;

const col = () => db.collection('users').doc(auth.currentUser.uid).collection('parcels');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function showError(text) {
  $('error').textContent = text || '';
  $('error').hidden = !text;
}

// ---- Auth ----
$('signin').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch((e) => alert(e.message));
$('signout').onclick = () => auth.signOut();

auth.onAuthStateChanged((user) => {
  $('gate').hidden = !!user;
  $('app').hidden = !user;
  $('signout').hidden = !user;
  if (unsub) { unsub(); unsub = null; }
  clearInterval(timer);
  if (!user) { parcels = []; live = {}; return; }
  let first = true;
  unsub = col().orderBy('addedAt', 'desc').onSnapshot((snap) => {
    parcels = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
    if (first) { first = false; refresh(parcels.map((p) => p.id)); }
  }, (e) => showError('Could not load your list: ' + e.message));
  timer = setInterval(autoRefresh, AUTO_REFRESH_MS);
});

// ---- Add / remove ----
$('add').onclick = addParcels;
$('numbers').addEventListener('keydown', (e) => { if (e.key === 'Enter') addParcels(); });

async function addParcels() {
  showError('');
  const raw = $('numbers').value.split(/[\s,;]+/).map((s) => s.trim().toUpperCase()).filter(Boolean);
  const valid = [...new Set(raw.filter((n) => NUMBER_RE.test(n)))];
  const bad = raw.filter((n) => !NUMBER_RE.test(n));
  if (!valid.length) return showError('Enter a tracking number (letters and digits only, such as 1Z999AA10123456784).');
  if (bad.length) showError('Skipped invalid: ' + bad.join(', '));

  const label = valid.length === 1 ? $('label').value.trim() : '';
  const batch = db.batch();
  valid.forEach((n) => {
    const data = { addedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (label) data.label = label;
    // merge keeps cached status and the original addedAt of numbers already in the list
    if (parcels.some((p) => p.id === n)) { if (label) batch.set(col().doc(n), { label }, { merge: true }); }
    else batch.set(col().doc(n), data, { merge: true });
  });
  await batch.commit();
  $('numbers').value = '';
  $('label').value = '';
  refresh(valid);
}

async function removeParcel(id) {
  delete live[id];
  await col().doc(id).delete();
}

// ---- Refresh ----
$('refresh').onclick = () => refresh(parcels.map((p) => p.id));

function autoRefresh() {
  if (document.hidden) return;
  // delivered parcels don't change, so skip them
  const ids = parcels.filter((p) => (live[p.id] || p.cached)?.state !== 'delivered').map((p) => p.id);
  refresh(ids);
}

async function refresh(ids) {
  if (!ids.length || busy || !auth.currentUser) return;
  busy = true;
  $('refresh').disabled = true;
  $('refresh').textContent = 'Refreshing…';
  try {
    const token = await auth.currentUser.getIdToken();
    const res = await fetch('/api/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ numbers: ids }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Tracking request failed (' + res.status + ')');

    const batch = db.batch();
    data.results.forEach((r) => {
      live[r.number] = r;
      if (r.ok && parcels.some((p) => p.id === r.number)) {
        const { number, ok, ...cached } = JSON.parse(JSON.stringify(r)); // drops undefined
        batch.set(col().doc(r.number), { cached, checkedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      }
    });
    await batch.commit();
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    showError('');
  } catch (e) {
    showError(e.message);
  } finally {
    busy = false;
    $('refresh').disabled = false;
    $('refresh').textContent = 'Refresh all';
    render();
  }
}

// ---- Render ----
const fmtDay = (d) => (d ? new Date(d + 'T00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) : '');

function render() {
  const list = $('list');
  if (!parcels.length) {
    list.innerHTML = '<div class="empty">No parcels yet. Add a tracking number above.</div>';
    return;
  }
  const open = new Set([...list.querySelectorAll('details[open]')].map((d) => d.dataset.id));
  list.innerHTML = parcels.map((p) => {
    const r = live[p.id] || (p.cached ? { ok: true, ...p.cached } : null);
    const nick = p.label ? `<span class="nick">${esc(p.label)}</span>` : '';
    const head = `<div class="row"><span class="num">${esc(p.id)}${nick}</span></div>`;
    const remove = `<div class="actions"><button class="ghost" data-remove="${esc(p.id)}">Remove</button></div>`;

    if (!r) return `<article class="parcel">${head}<div class="meta">Checking…</div>${remove}</article>`;
    if (!r.ok) return `<article class="parcel" data-state="exception">${head}<div class="meta err">${esc(r.error)}</div>${remove}</article>`;

    const when = [fmtDay(r.date), r.time].filter(Boolean).join(' at ');
    const eta = r.state === 'delivered' ? '' : r.eta ? `Estimated delivery ${esc(fmtDay(r.eta))}` : '';
    const events = (r.events || []).map((e) =>
      `<li><strong>${esc(e.status)}</strong><div class="meta">${esc([e.location, [fmtDay(e.date), e.time].filter(Boolean).join(' at ')].filter(Boolean).join(' · '))}</div></li>`
    ).join('');
    return `<article class="parcel" data-state="${esc(r.state)}">
      ${head}
      <div class="status">${esc(r.status)}</div>
      <div class="meta">${esc([r.location, when].filter(Boolean).join(' · '))}</div>
      ${eta ? `<div class="meta">${eta}</div>` : ''}
      ${events ? `<details data-id="${esc(p.id)}"${open.has(p.id) ? ' open' : ''}><summary>History (${r.events.length})</summary><ol>${events}</ol></details>` : ''}
      ${remove}
    </article>`;
  }).join('');
}

$('list').addEventListener('click', (e) => {
  const id = e.target.dataset.remove;
  if (id && confirm('Remove ' + id + ' from your list?')) removeParcel(id);
});
</script>
</body>
</html>
