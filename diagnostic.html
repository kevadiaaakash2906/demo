<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINÉRE Ledger — Firestore Diagnostic</title>
<style>
  :root{ --bg:#1E1B18; --surface:#262220; --line:#3B342E; --gold:#B8935A; --text:#EDE7DD; --text-dim:#A69C8D; --good:#7A9B7E; --bad:#C0705A; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:40px 24px; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; max-width:700px; margin:0 auto; }
  h1{ color:var(--gold); font-size:22px; margin-bottom:8px; }
  p{ color:var(--text-dim); line-height:1.6; margin-bottom:16px; }
  .step{ background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:18px; margin-bottom:14px; }
  .step h3{ margin:0 0 8px; color:var(--gold); font-size:14px; }
  button{ padding:10px 18px; border-radius:4px; border:1px solid var(--gold); background:var(--gold); color:#20190F; font-weight:600; font-size:14px; cursor:pointer; }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  #log{ background:#0d0b09; border:1px solid var(--line); border-radius:4px; padding:14px; font-family:'IBM Plex Mono',monospace; font-size:12px; max-height:400px; overflow-y:auto; margin-top:12px; white-space:pre-wrap; }
  .ok{ color:var(--good); }
  .err{ color:var(--bad); }
  .info{ color:var(--text-dim); }
  input{ padding:10px 14px; border-radius:4px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px; width:100%; margin-bottom:10px; }
</style>
</head>
<body>

<h1>🔧 Firestore Diagnostic</h1>
<p>This page tests your Firebase connection, auth, and Firestore data. Run each step and screenshot the results.</p>

<div class="step">
  <h3>Step 1 — Sign In</h3>
  <input type="password" id="passInput" placeholder="Access code" autocomplete="off">
  <button onclick="doLogin()">Sign In</button>
  <div id="authResult" style="margin-top:10px;font-size:13px;"></div>
</div>

<div class="step">
  <h3>Step 2 — List Collections</h3>
  <button onclick="listCollections()" id="listBtn" disabled>List Collections</button>
  <div id="collectionsResult" style="margin-top:10px;font-size:13px;"></div>
</div>

<div class="step">
  <h3>Step 3 — Count Orders</h3>
  <button onclick="countOrders()" id="countBtn" disabled>Count Orders</button>
  <div id="countResult" style="margin-top:10px;font-size:13px;"></div>
</div>

<div class="step">
  <h3>Step 4 — Read First 5 Orders</h3>
  <button onclick="readOrders()" id="readBtn" disabled>Read Orders</button>
  <div id="readResult" style="margin-top:10px;font-size:13px;"></div>
</div>

<div id="log"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, query, orderBy, limit, doc, getDoc, listDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC3GlUHfz6Zfd1o5eymGcY_jkyz4MuVfls",
    authDomain: "vinereledger-b29be.firebaseapp.com",
    projectId: "vinereledger-b29be",
    storageBucket: "vinereledger-b29be.firebasestorage.app",
    messagingSenderId: "701394930039",
    appId: "1:701394930039:web:456e7ae9c61fc92402b972"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const PASS_MAP = {
    'Arp&diam4265': 'staff@vinere.local',
    'Het&ke4265':   'seller@vinere.local',
    'qwertyuiop':   'customer@vinere.local'
  };

  function log(msg, type='info') {
    const el = document.getElementById('log');
    const line = document.createElement('div');
    line.className = type;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
    console.log(`[${type}] ${msg}`);
  }

  window.doLogin = async function() {
    const pass = document.getElementById('passInput').value.trim();
    const resultEl = document.getElementById('authResult');
    if (!pass) { resultEl.innerHTML = '<span class="err">Enter a password</span>'; return; }
    const email = PASS_MAP[pass];
    if (!email) { resultEl.innerHTML = '<span class="err">Unknown password</span>'; return; }
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      resultEl.innerHTML = `<span class="ok">✓ Signed in as ${cred.user.email} (uid: ${cred.user.uid})</span>`;
      log(`Authenticated: ${cred.user.email}`, 'ok');
      document.getElementById('listBtn').disabled = false;
      document.getElementById('countBtn').disabled = false;
      document.getElementById('readBtn').disabled = false;
    } catch (err) {
      resultEl.innerHTML = `<span class="err">✗ ${err.code}: ${err.message}</span>`;
      log(`Auth failed: ${err.code} - ${err.message}`, 'err');
    }
  };

  window.listCollections = async function() {
    const resultEl = document.getElementById('collectionsResult');
    try {
      // Firestore web SDK doesn't support listCollections() on the root
      // So we just try to get docs from the 'orders' collection
      const snap = await getDocs(collection(db, 'orders'));
      resultEl.innerHTML = `<span class="ok">✓ 'orders' collection accessible. Documents found: ${snap.size}</span>`;
      log(`Collection 'orders' has ${snap.size} documents`, 'ok');
    } catch (err) {
      resultEl.innerHTML = `<span class="err">✗ ${err.code}: ${err.message}</span>`;
      log(`Collection error: ${err.code} - ${err.message}`, 'err');
    }
  };

  window.countOrders = async function() {
    const resultEl = document.getElementById('countResult');
    try {
      const snap = await getDocs(collection(db, 'orders'));
      resultEl.innerHTML = `<span class="ok">✓ Total orders in Firestore: ${snap.size}</span>`;
      log(`Total orders: ${snap.size}`, 'ok');
      if (snap.size > 0) {
        const first = snap.docs[0];
        log(`First doc ID: ${first.id}`, 'info');
        log(`First doc keys: ${Object.keys(first.data()).join(', ')}`, 'info');
      }
    } catch (err) {
      resultEl.innerHTML = `<span class="err">✗ ${err.code}: ${err.message}</span>`;
      log(`Count error: ${err.code} - ${err.message}`, 'err');
    }
  };

  window.readOrders = async function() {
    const resultEl = document.getElementById('readResult');
    try {
      const snap = await getDocs(query(collection(db, 'orders'), orderBy('Sr. No.', 'asc'), limit(5)));
      if (snap.empty) {
        resultEl.innerHTML = '<span class="err">✗ No documents found in orders collection</span>';
        log('No documents found', 'err');
        return;
      }
      let html = '<span class="ok">✓ Read ' + snap.size + ' orders:</span><br>';
      snap.forEach(d => {
        const data = d.data();
        html += `• <b>${d.id}</b> — Sr.${data['Sr. No.']} | ${data['Style No.']} | ${data['CUSTOMER '] || data['CUSTOMER']}<br>`;
      });
      resultEl.innerHTML = html;
      log(`Read ${snap.size} orders successfully`, 'ok');
    } catch (err) {
      resultEl.innerHTML = `<span class="err">✗ ${err.code}: ${err.message}</span>`;
      log(`Read error: ${err.code} - ${err.message}`, 'err');
    }
  };

  // Also log auth state changes
  onAuthStateChanged(auth, user => {
    if (user) log(`Auth state: signed in as ${user.email}`, 'ok');
    else log('Auth state: signed out', 'info');
  });
</script>

</body>
</html>
