<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINÉRE Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1E1B18; --surface: #262220; --surface-raised: #2E2925; --line: #3B342E;
    --gold: #B8935A; --gold-soft: #8f7248; --gold-glow: rgba(184,147,90,0.15);
    --text: #EDE7DD; --text-dim: #A69C8D; --good: #7A9B7E; --bad: #C0705A; --accent: #6B8E9B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0}
  ::selection{background:var(--gold);color:#1E1B18}

  @media (pointer: fine) { html,body,a,button,input,select,textarea{cursor:none} }

  .cursor-ring{position:fixed;top:0;left:0;width:40px;height:40px;border:1px solid rgba(184,147,90,0.45);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .25s,height .25s,border-color .25s,background .25s;mix-blend-mode:difference}
  .cursor-ring.hover{width:64px;height:64px;border-color:var(--gold);background:rgba(184,147,90,0.08)}
  .cursor-dot{position:fixed;top:0;left:0;width:6px;height:6px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);box-shadow:0 0 10px var(--gold-glow)}
  .cursor-trail{position:fixed;width:4px;height:4px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9998;opacity:0}
  .ripple{position:fixed;border-radius:50%;border:1px solid var(--gold);pointer-events:none;z-index:9997;transform:translate(-50%,-50%) scale(0);animation:rippleExpand .8s cubic-bezier(0.16,1,0.3,1) forwards}
  @keyframes rippleExpand{to{transform:translate(-50%,-50%) scale(4);opacity:0}}

  .bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0}
  #noiseCanvas{opacity:.04;mix-blend-mode:overlay}
  #particleCanvas{opacity:.6}
  .vignette{background:radial-gradient(circle at 50% 50%,transparent 0%,var(--bg) 85%);z-index:1}

  #login{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;transition:opacity .8s ease,transform .8s cubic-bezier(0.16,1,0.3,1)}
  #login.hidden{opacity:0;transform:scale(1.02);pointer-events:none}
  .login-stage{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
  .logo-wrap{position:relative;opacity:0;transform:scale(0.92) translateY(12px);animation:reveal 1.6s cubic-bezier(0.16,1,0.3,1) .2s forwards}
  .logo-wrap::before{content:'';position:absolute;inset:-60px;background:radial-gradient(circle,var(--gold-glow) 0%,transparent 70%);opacity:0;animation:glowPulse 4s ease-in-out 1.8s infinite alternate;pointer-events:none}
  .logo-wrap img{display:block;width:clamp(220px,34vw,480px);height:auto;filter:drop-shadow(0 0 0 rgba(184,147,90,0));transition:filter .6s,transform .6s cubic-bezier(0.16,1,0.3,1);position:relative;z-index:2}
  .logo-wrap:hover img{filter:drop-shadow(0 0 28px var(--gold-glow));transform:scale(1.03)}
  .tagline{font-family:'IBM Plex Sans',sans-serif;font-weight:300;font-size:clamp(11px,1.2vw,14px);letter-spacing:6px;text-transform:uppercase;color:var(--text-dim);opacity:0;animation:fadeUp 1.2s ease 1.0s forwards}
  .login-form{margin-top:32px;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;animation:fadeUp 1.2s ease 1.4s forwards;width:320px;max-width:90vw}
  .login-form input{width:100%;padding:14px 18px;border-radius:3px;border:1px solid var(--line);background:rgba(38,34,32,0.6);color:var(--text);font-size:14px;text-align:center;outline:none;backdrop-filter:blur(6px);transition:border-color .2s,box-shadow .2s;letter-spacing:.5px}
  .login-form input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
  .login-form input::placeholder{color:var(--text-dim);opacity:.6}
  .role-hint{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--text-dim)}
  .role-hint span{border:1px solid var(--line);border-radius:20px;padding:4px 12px;letter-spacing:.3px}
  #loginBtn{width:100%;padding:14px 22px;border-radius:3px;border:1px solid var(--gold-soft);background:var(--gold);color:#20190F;font-weight:600;font-size:13px;letter-spacing:2px;text-transform:uppercase;cursor:none;position:relative;overflow:hidden;transition:all .35s ease}
  #loginBtn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transform:translateX(-100%);transition:transform .6s ease}
  #loginBtn:hover{background:#c9a06a;letter-spacing:3px}
  #loginBtn:hover::before{transform:translateX(100%)}
  #loginBtn:active{transform:translateY(1px)}
  #loginError{color:var(--bad);font-size:13px;min-height:18px;text-align:center}
  @keyframes reveal{to{opacity:1;transform:scale(1) translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes glowPulse{from{opacity:.3;transform:scale(.95)}to{opacity:.7;transform:scale(1.05)}}

  #app{display:none;min-height:100vh;opacity:0;transition:opacity .6s ease}
  #app.visible{opacity:1}
  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(30,27,24,0.95);z-index:10;backdrop-filter:blur(8px);flex-wrap:wrap;gap:14px}
  header.topbar .titles{display:flex;align-items:baseline;gap:14px}
  header.topbar .titles .mark{font-size:22px;display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:700;letter-spacing:.5px}
  header.topbar .titles .sub{color:var(--text-dim);font-size:12.5px;letter-spacing:.4px;text-transform:uppercase}
  .mini-logo{width:26px;height:26px;border-radius:50%;background:var(--gold);display:inline-block}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #search{padding:10px 14px;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;width:240px;transition:border-color .2s,box-shadow .2s}
  #search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
  .btn{padding:13px 22px;border-radius:3px;border:1px solid var(--gold-soft);background:var(--gold);color:#20190F;font-weight:600;font-size:14px;cursor:none;letter-spacing:.2px;transition:all .15s}
  .btn:hover{background:#c9a06a;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.secondary{background:transparent;color:var(--text);border-color:var(--line)}
  .btn.secondary:hover{background:var(--surface-raised)}
  .btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
  .btn.danger:hover{background:rgba(192,112,90,0.12)}
  .btn.small{padding:8px 14px;font-size:12.5px}
  main{padding:24px 32px 80px;max-width:1500px;margin:0 auto}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px 18px;transition:border-color .2s}
  .kpi-card:hover{border-color:var(--gold-soft)}
  .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:6px}
  .kpi-value{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:500;color:var(--gold)}
  .kpi-sub{font-size:11.5px;color:var(--text-dim);margin-top:4px}
  .table-wrap{border:1px solid var(--line);border-radius:4px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:12px 14px;background:var(--surface);color:var(--text-dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s;position:relative}
  thead th:hover{color:var(--gold)}
  thead th.sort-asc::after{content:' ▲';color:var(--gold);font-size:9px}
  thead th.sort-desc::after{content:' ▼';color:var(--gold);font-size:9px}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr{cursor:none;transition:background .12s}
  tbody tr:hover{background:var(--surface)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.selected{background:var(--gold-glow)}
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right}
  .style-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);background:rgba(184,147,90,0.12);padding:3px 8px;border-radius:2px;position:relative;display:inline-block}
  .style-tag::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--gold);border-radius:2px 0 0 2px}
  .customer-cell{color:var(--text);font-weight:500}
  .empty-state{padding:60px 20px;text-align:center;color:var(--text-dim)}
  .empty-state h3{color:var(--text);margin-bottom:8px}
  .loading-row td{color:var(--text-dim);text-align:center;padding:40px}
  .badge{display:inline-block;padding:2px 8px;border-radius:2px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
  .badge-het{background:rgba(184,147,90,0.15);color:var(--gold)}
  .badge-cvd{background:rgba(107,142,155,0.15);color:var(--accent)}
  .badge-other{background:rgba(166,156,141,0.15);color:var(--text-dim)}

  #overlay{display:none;position:fixed;inset:0;background:rgba(10,9,7,0.6);z-index:20;backdrop-filter:blur(3px)}
  #overlay.open{display:block}
  #panel{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:94vw;background:var(--surface-raised);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .3s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column}
  #panel.open{transform:translateX(0)}
  .panel-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .panel-head h2{font-size:19px}
  .panel-head button{background:none;border:none;color:var(--text-dim);font-size:22px;cursor:none;padding:4px;line-height:1;transition:color .15s}
  .panel-head button:hover{color:var(--text)}
  .panel-body{padding:20px 24px;overflow-y:auto;flex:1}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;border-radius:3px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;transition:border-color .2s,box-shadow .2s}
  .field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow)}
  .field input.error{border-color:var(--bad);box-shadow:0 0 0 3px rgba(192,112,90,0.15)}
  .field-row{display:flex;gap:12px}
  .field-row .field{flex:1}
  body.view-only .panel-foot{display:none}
  body.view-only tbody tr{cursor:default}
  body.view-only .field input{opacity:.65;cursor:not-allowed}
  .panel-foot{padding:18px 24px;border-top:1px solid var(--line);display:flex;gap:10px}
  .panel-foot .btn{flex:1;text-align:center}
  #deleteBtn{background:transparent;border-color:var(--bad);color:var(--bad);flex:0 0 auto;padding:13px 16px;position:relative;overflow:hidden}
  #deleteBtn:hover{background:rgba(192,112,90,0.12)}
  #deleteBtn.holding{background:var(--bad);color:var(--bg)}
  #deleteProgress{position:absolute;left:0;top:0;height:100%;width:0%;background:rgba(255,255,255,0.25);transition:width .1s linear}
  #saveMsg{font-size:13px;margin-top:10px;min-height:16px}
  #saveMsg.good{color:var(--good)}
  #saveMsg.bad{color:var(--bad)}
  .computed-note{font-size:12px;color:var(--text-dim);margin-top:2px;line-height:1.5}
  .computed-preview{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin-top:14px}
  .computed-preview h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);margin:0 0 8px 0}
  .computed-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
  .computed-row .label{color:var(--text-dim)}
  .computed-row .value{font-family:'IBM Plex Mono',monospace;color:var(--gold)}
  #toast{position:fixed;bottom:24px;right:24px;padding:14px 20px;border-radius:4px;background:var(--surface-raised);border:1px solid var(--line);color:var(--text);font-size:13.5px;z-index:30;transform:translateY(100px);opacity:0;transition:all .3s ease;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
  #toast.show{transform:translateY(0);opacity:1}
  #toast.good{border-color:var(--good);color:var(--good)}
  #toast.bad{border-color:var(--bad);color:var(--bad)}

  @media (max-width:768px){
    header.topbar{padding:14px 16px}
    main{padding:16px}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    #panel{width:100vw;max-width:100vw}
    .cursor-ring,.cursor-dot,.cursor-trail{display:none}
    html,body,a,button,input{cursor:auto}
  }
</style>
</head>

<div class="cursor-dot" id="cursorDot"></div>

    <h2 id="panelTitle">Order Details</h2>
    <button id="closePanel">&times;</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-foot" id="panelFoot">
    <button class="btn" id="saveBtn">Save Changes</button>
    <button class="btn secondary" id="cancelBtn">Cancel</button>
    <button id="deleteBtn"><div id="deleteProgress"></div>Hold to Delete</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ===================== CONFIG ===================== */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzg05QdulALk-vc8VKwZOs8jg19o3PBPRUv6vusn7NcbfFGoBbBHeaP4lL3lGihFIqZ/exec';
/* ================================================== */

let state = { rows: [], headers: [], role: null, sortCol: null, sortAsc: true, selectedRow: null, search: '' };
const $ = id => document.getElementById(id);
const fmt = n => typeof n === 'number' ? n.toLocaleString('en-IN', {maximumFractionDigits:2}) : (n || '');
const money = n => typeof n === 'number' ? '$ ' + n.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}) : (n || '');
const toast = (msg, good=true) => {
  const t = $('toast'); t.textContent = msg; t.className = 'show ' + (good ? 'good' : 'bad');
  setTimeout(() => t.className = '', 3000);
};

function api(action, extra={}) {
  const url = ENDPOINT + '?callback=cb&pass=' + encodeURIComponent(sessionStorage.getItem('het_pass')||'') + '&action=' + encodeURIComponent(action)
    + (extra.fields ? '&fields=' + encodeURIComponent(JSON.stringify(extra.fields)) : '')
    + (extra.row ? '&row=' + encodeURIComponent(extra.row) : '');
  return new Promise((resolve, reject) => {
    const scr = document.createElement('script');
    const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    window[cbName] = data => { delete window[cbName]; if(scr.parentNode) scr.parentNode.removeChild(scr); resolve(data); };
    scr.onerror = () => { delete window[cbName]; reject('Network error'); };
    scr.src = url.replace('callback=cb', 'callback=' + encodeURIComponent(cbName));
    document.head.appendChild(scr);
  });
}

/* ---------- Login ---------- */
async function doLogin() {
  const pass = $('passInput').value.trim();
  if(!pass) return;
  sessionStorage.setItem('het_pass', pass);
  $('loginError').textContent = '';
  const data = await api('auth');
  if(!data.ok) {
    $('loginError').textContent = data.error || 'Authentication failed';
    sessionStorage.removeItem('het_pass'); return;
  }
  state.role = data.role;
  if(state.role === 'customer') document.body.classList.add('view-only');
  $('login').classList.add('hidden');
  $('app').style.display = 'block';
  requestAnimationFrame(() => $('app').classList.add('visible'));
  loadData(data);
}
$('loginBtn').onclick = doLogin;
$('passInput').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

/* ---------- Data ---------- */
function loadData(data) { state.rows = data.rows || []; state.headers = data.headers || []; renderKPIs(); renderTable(); }
async function refresh() { const data = await api('auth'); if(data.ok) loadData(data); }
$('refreshBtn').onclick = refresh;
$('logoutBtn').onclick = () => { sessionStorage.removeItem('het_pass'); location.reload(); };

/* ---------- KPIs ---------- */
function renderKPIs() {
  const rows = state.rows;
  const totalOrders = rows.length;
  const totalGold = rows.reduce((s,r) => s + (parseFloat(r['Gold Amount'])||0), 0);
  const totalDia = rows.reduce((s,r) => s + (parseFloat(r['Diam Amount'])||0), 0);
  const totalSub = rows.reduce((s,r) => s + (parseFloat(r['SUB TOTAL'])||0), 0);
  const totalUSD = rows.reduce((s,r) => s + (parseFloat(r['$'])||0), 0);
  const avgMult = totalOrders ? (rows.reduce((s,r) => s + (parseFloat(r['Multiplier'])||0), 0)/totalOrders).toFixed(3) : '0.595';
  const kpis = [
    {label:'Total Orders', value:totalOrders},
    {label:'Gold Amount', value:'₹ ' + fmt(totalGold), sub:'at ₹16,000 / 10g'},
    {label:'Diamond Amount', value:'₹ ' + fmt(totalDia)},
    {label:'Sub Total', value:'₹ ' + fmt(totalSub)},
    {label:'Total ($)', value:'$ ' + fmt(totalUSD), sub:'at ₹94 / $'},
    {label:'Avg Multiplier', value:avgMult}
  ];
  $('kpiGrid').innerHTML = kpis.map(k => `<div class="kpi-card"><div class="kpi-label">${k.label}</div><div class="kpi-value">${k.value}</div>${k.sub?`<div class="kpi-sub">${k.sub}</div>`:''}</div>`).join('');
}

/* ---------- Table ---------- */
function renderTable() {
  const thead = $('headerRow'), tbody = $('tableBody'), h = state.headers;
  thead.innerHTML = h.map((hdr,i) => {
    const active = state.sortCol === hdr;
    const cls = active ? (state.sortAsc ? 'sort-asc' : 'sort-desc') : '';
    return `<th class="${cls}" onclick="sortBy('${hdr}')">${hdr}</th>`;
  }).join('');
  let rows = state.rows.filter(r => {
    const term = state.search.toLowerCase();
    return !term || (r['CUSTOMER']||'').toLowerCase().includes(term) || (r['Style No.']||'').toLowerCase().includes(term);
  });
  if(state.sortCol) {
    rows.sort((a,b) => {
      let av = a[state.sortCol], bv = b[state.sortCol];
      if(typeof av === 'number' && typeof bv === 'number') return state.sortAsc ? av - bv : bv - av;
      av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
      if(av < bv) return state.sortAsc ? -1 : 1;
      if(av > bv) return state.sortAsc ? 1 : -1;
      return 0;
    });
  }
  if(!rows.length) {
    tbody.innerHTML = `<tr><td colspan="${h.length}" class="empty-state"><h3>No orders found</h3><p>Try adjusting your search.</p></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const selected = state.selectedRow && state.selectedRow._row === r._row ? 'selected' : '';
    const badge = (r['CUSTOMER']||'').toUpperCase().includes('CVD') ? 'badge-cvd' : ((r['CUSTOMER']||'').toUpperCase().includes('HET') ? 'badge-het' : 'badge-other');
    return `<tr class="${selected}" onclick='openPanel(${JSON.stringify(r)})'>
      <td>${r['Sr. No.']}</td>
      <td class="customer-cell"><span class="badge ${badge}">${r['CUSTOMER']}</span></td>
      <td><span class="style-tag">${r['Style No.']}</span></td>
      <td>${r['Date']}</td>
      <td class="num">${fmt(r['Gross Wt'])}</td>
      <td class="num">${fmt(r['Dia Qty'])}</td>
      <td class="num">${fmt(r['IN CT'])}</td>
      <td class="num">${fmt(r['COLOUR STONE'])}</td>
      <td class="num">${fmt(r['Net Wt'])}</td>
      <td class="num">${fmt(r['Multiplier'])}</td>
      <td class="num">${fmt(r['Pg Wt'])}</td>
      <td class="num">₹ ${fmt(r['Gold Amount'])}</td>
      <td class="num">₹ ${fmt(r['Diam Amount'])}</td>
      <td class="num">₹ ${fmt(r['L CHARGES'])}</td>
      <td class="num">₹ ${fmt(r['LABOR AMOUNT'])}</td>
      <td class="num">₹ ${fmt(r['SUB TOTAL'])}</td>
      <td class="num">${money(r['$'])}</td>
    </tr>`;
  }).join('');
}
window.sortBy = col => { if(state.sortCol === col) state.sortAsc = !state.sortAsc; else { state.sortCol = col; state.sortAsc = true; } renderTable(); };
$('search').oninput = e => { state.search = e.target.value; renderTable(); };

/* ---------- Panel ---------- */
function openPanel(row) {
  state.selectedRow = row;
  const isNew = !row;
  const r = row || {};
  $('panelTitle').textContent = isNew ? 'New Order' : 'Edit Order';
  $('panelBody').innerHTML = buildForm(r);
  $('overlay').classList.add('open');
  $('panel').classList.add('open');
  renderPreview(r);
  if(!isNew) document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('selected'));
}
function buildForm(r) {
  const disabled = state.role === 'customer' ? 'disabled' : '';
  const f = (label,key,type='text',extra='') => `<div class="field"><label>${label}</label><input ${disabled} type="${type}" id="f_${key.replace('.','\.')}" value="${r[key]!==undefined&&r[key]!==null?r[key]:''}" ${extra}></div>`;
  return `
    <div class="field-row">${f('Customer','CUSTOMER')}${f('Style No.','Style No.')}</div>
    ${f('Date','Date','date')}
    <div class="field-row">${f('Gross Wt','Gross Wt','number','step="0.001"')}${f('Net Wt','Net Wt','number','step="0.001"')}</div>
    <div class="field-row">${f('Dia Qty','Dia Qty','number')}${f('IN CT','IN CT','number','step="0.01"')}</div>
    <div class="field-row">${f('Colour Stone','COLOUR STONE','number')}${f('Multiplier','Multiplier','number','step="0.001"')}</div>
    <div class="field-row">${f('Diam Amount','Diam Amount','number','step="0.01"')}${f('L Charges','L CHARGES','number','step="0.01"')}</div>
    <div class="computed-preview">
      <h4>Live Preview</h4>
      <div class="computed-row"><span class="label">Pg Wt</span><span class="value" id="pv_pg">—</span></div>
      <div class="computed-row"><span class="label">Gold Amount</span><span class="value" id="pv_gold">—</span></div>
      <div class="computed-row"><span class="label">Labor Amount</span><span class="value" id="pv_labor">—</span></div>
      <div class="computed-row"><span class="label">Sub Total</span><span class="value" id="pv_sub">—</span></div>
      <div class="computed-row"><span class="label">USD</span><span class="value" id="pv_usd">—</span></div>
    </div>
    <div id="saveMsg"></div>`;
}
function getField(key) { return document.getElementById('f_' + key.replace('.','\.'))?.value || ''; }
function computePreview() {
  const net = parseFloat(getField('Net Wt'))||0, mult = parseFloat(getField('Multiplier'))||0.595;
  const diam = parseFloat(getField('Diam Amount'))||0, lCharges = parseFloat(getField('L CHARGES'))||0;
  const goldRate=16000, usdRate=94;
  const pg = net*mult, goldAmt = pg*goldRate, labor = net*lCharges, sub = goldAmt + diam + labor, usd = sub/usdRate;
  $('pv_pg').textContent = fmt(pg);
  $('pv_gold').textContent = '₹ ' + fmt(goldAmt);
  $('pv_labor').textContent = '₹ ' + fmt(labor);
  $('pv_sub').textContent = '₹ ' + fmt(sub);
  $('pv_usd').textContent = '$ ' + fmt(usd);
}
function renderPreview(r) { setTimeout(() => { document.querySelectorAll('#panelBody input').forEach(i => i.addEventListener('input', computePreview)); computePreview(); }, 0); }
function closePanel() { $('overlay').classList.remove('open'); $('panel').classList.remove('open'); state.selectedRow = null; document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('selected')); }
$('overlay').onclick = closePanel; $('closePanel').onclick = closePanel; $('cancelBtn').onclick = closePanel;

/* ---------- Save / Add ---------- */
$('addBtn').onclick = () => openPanel(null);
$('saveBtn').onclick = async () => {
  const msg = $('saveMsg'); msg.className = ''; msg.textContent = '';
  const fields = {
    customer: getField('CUSTOMER'), style: getField('Style No.'), date: getField('Date'),
    grossWt: getField('Gross Wt'), netWt: getField('Net Wt'), diaQty: getField('Dia Qty'),
    inCt: getField('IN CT'), colourStone: getField('COLOUR STONE'), multiplier: getField('Multiplier'),
    diamAmount: getField('Diam Amount'), lCharges: getField('L CHARGES')
  };
  if(!fields.customer || !fields.style) { msg.className='bad'; msg.textContent='Customer and Style No. are required.'; return; }
  const isNew = !state.selectedRow, row = isNew ? null : state.selectedRow._row;
  try {
    const data = await api(isNew ? 'add' : 'edit', {fields, row});
    if(data.ok) { msg.className='good'; msg.textContent = isNew ? 'Order added.' : 'Saved.'; toast(isNew ? 'Order added successfully' : 'Changes saved'); await refresh(); closePanel(); }
    else { msg.className='bad'; msg.textContent = data.error || 'Error'; }
  } catch(e) { msg.className='bad'; msg.textContent = String(e); }
};

/* ---------- Delete ---------- */
let deleteTimer = null;
$('deleteBtn').onmousedown = $('deleteBtn').ontouchstart = () => {
  if(state.role !== 'staff' || !state.selectedRow) return;
  $('deleteBtn').classList.add('holding');
  let w = 0;
  deleteTimer = setInterval(() => { w += 5; $('deleteProgress').style.width = w + '%'; if(w >= 100) { clearInterval(deleteTimer); doDelete(); } }, 50);
};
const cancelDelete = () => { if(deleteTimer) clearInterval(deleteTimer); $('deleteProgress').style.width = '0%'; $('deleteBtn').classList.remove('holding'); };
$('deleteBtn').onmouseup = $('deleteBtn').onmouseleave = $('deleteBtn').ontouchend = cancelDelete;
async function doDelete() {
  if(!state.selectedRow) return;
  try {
    const data = await api('delete', {row: state.selectedRow._row});
    if(data.ok) { toast('Order deleted'); await refresh(); closePanel(); }
    else { toast(data.error || 'Delete failed', false); }
  } catch(e) { toast(String(e), false); }
}

/* ===================== ANIMATIONS ===================== */
/* Noise */
const noiseCanvas = document.getElementById('noiseCanvas');
const nCtx = noiseCanvas.getContext('2d');
function resizeNoise() { noiseCanvas.width = window.innerWidth; noiseCanvas.height = window.innerHeight; }
resizeNoise(); window.addEventListener('resize', resizeNoise);
function drawNoise() {
  const w = noiseCanvas.width, h = noiseCanvas.height;
  const idata = nCtx.createImageData(w, h);
  const buf = new Uint32Array(idata.data.buffer);
  for(let i = 0; i < buf.length; i++) buf[i] = ((Math.random() * 40 | 0) << 24) | 0xFFFFFF;
  nCtx.putImageData(idata, 0, 0);
  requestAnimationFrame(drawNoise);
}
drawNoise();

/* Particles */
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
let W, H;
const particles = [];
const PARTICLE_COUNT = 70, CONNECTION_DIST = 120, MOUSE_DIST = 180;
function resizeParticles() { W = pCanvas.width = window.innerWidth; H = pCanvas.height = window.innerHeight; }
resizeParticles(); window.addEventListener('resize', resizeParticles);
class Particle {
  constructor() { this.x = Math.random()*W; this.y = Math.random()*H; this.vx = (Math.random()-0.5)*0.3; this.vy = (Math.random()-0.5)*0.3; this.size = Math.random()*1.5+0.5; this.alpha = Math.random()*0.4+0.1; }
  update(mx,my) {
    this.x += this.vx; this.y += this.vy;
    if(this.x < 0) this.x = W; if(this.x > W) this.x = 0; if(this.y < 0) this.y = H; if(this.y > H) this.y = 0;
    const dx = this.x - mx, dy = this.y - my, d = Math.sqrt(dx*dx + dy*dy);
    if(d < MOUSE_DIST && d > 0) { const f = (MOUSE_DIST - d)/MOUSE_DIST; this.x += (dx/d)*f*0.6; this.y += (dy/d)*f*0.6; }
  }
  draw() { pCtx.beginPath(); pCtx.arc(this.x,this.y,this.size,0,Math.PI*2); pCtx.fillStyle = `rgba(184,147,90,${this.alpha})`; pCtx.fill(); }
}
for(let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
let mouseX = W/2, mouseY = H/2;
function animateParticles() {
  pCtx.clearRect(0,0,W,H);
  particles.forEach(p => p.update(mouseX, mouseY));
  for(let i = 0; i < particles.length; i++) for(let j = i+1; j < particles.length; j++) {
    const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, d = Math.sqrt(dx*dx + dy*dy);
    if(d < CONNECTION_DIST) { pCtx.beginPath(); pCtx.moveTo(particles[i].x,particles[i].y); pCtx.lineTo(particles[j].x,particles[j].y); pCtx.strokeStyle = `rgba(184,147,90,${(1-d/CONNECTION_DIST)*0.12})`; pCtx.lineWidth = 0.6; pCtx.stroke(); }
  }
  particles.forEach(p => p.draw());
  requestAnimationFrame(animateParticles);
}
animateParticles();

/* Cursor */
const ring = document.getElementById('cursorRing');
const dot = document.getElementById('cursorDot');
let rx = 0, ry = 0, dx = 0, dy = 0, dotX = 0, dotY = 0;
const trails = [];
for(let i = 0; i < 12; i++) { const t = document.createElement('div'); t.className = 'cursor-trail'; document.body.appendChild(t); trails.push({el:t,x:0,y:0}); }
document.addEventListener('mousemove', e => { dx = e.clientX; dy = e.clientY; mouseX = e.clientX; mouseY = e.clientY; });
document.addEventListener('mousedown', e => {
  const r = document.createElement('div'); r.className = 'ripple'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px'; r.style.width = r.style.height = '20px'; document.body.appendChild(r); setTimeout(() => r.remove(), 800);
});
function animateCursor() {
  rx += (dx - rx) * 0.15; ry += (dy - ry) * 0.15; ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  dotX += (dx - dotX) * 0.35; dotY += (dy - dotY) * 0.35; dot.style.left = dotX + 'px'; dot.style.top = dotY + 'px';
  let tx = dotX, ty = dotY;
  trails.forEach((t,i) => { t.x += (tx - t.x) * (0.25 - i*0.015); t.y += (ty - t.y) * (0.25 - i*0.015); t.el.style.left = t.x + 'px'; t.el.style.top = t.y + 'px'; t.el.style.opacity = (1 - i/12) * 0.45; t.el.style.transform = `translate(-50%,-50%) scale(${1 - i/12})`; tx = t.x; ty = t.y; });
  requestAnimationFrame(animateCursor);
}
animateCursor();

/* Hover detection (delegated) */
function updateHoverables() {
  document.querySelectorAll('a, button, input, .logo-wrap, tbody tr, .kpi-card').forEach(el => {
    el.addEventListener('mouseenter', () => ring.classList.add('hover'));
    el.addEventListener('mouseleave', () => ring.classList.remove('hover'));
  });
}
updateHoverables();

/* Logo 3D tilt */
const logoWrap = document.getElementById('logoWrap');
document.addEventListener('mousemove', e => {
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const x = (e.clientX - cx)/cx, y = (e.clientY - cy)/cy;
  if(logoWrap) logoWrap.style.transform = `perspective(800px) rotateY(${x*4}deg) rotateX(${-y*4}deg)`;
});
document.addEventListener('mouseleave', () => { if(logoWrap) logoWrap.style.transform = 'perspective(800px) rotateY(0deg) rotateX(0deg)'; });

/* Init */
if(sessionStorage.getItem('het_pass')) doLogin();
</script>
</body>
</html>
